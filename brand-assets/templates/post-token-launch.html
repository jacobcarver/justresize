<!doctype html>
<!--
  Token launch post, 1600 × 900.
  The export script only renders this once the token is live with a real mint in lib/config/site.ts,
  and fills the name, ticker and mint from that config. Never type an address into this file.
-->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="post.css">
<style>
  .headline { width: 820px; font-size: 80px; }
  .mint { position: absolute; left: 96px; top: 520px; width: 900px; }
  .mint p:first-child { font-size: 24px; color: var(--fg-tertiary); }
  .mint p:last-child { margin-top: 10px; font-size: 30px; word-break: break-all; }
  .sub { top: 660px; width: 900px; font-size: 28px; }
  .disc { width: 300px; height: 300px; border-radius: 50%; background: var(--accent); }
  .disc svg { display: block; width: 100%; height: 100%; }
</style></head>
<body>
  <div class="wordmark"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#3563e9"/><path d="M9 15V9h6M23 17v6h-6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>JustResize</div>
  <h1 class="headline">The JustResize token is live on Solana.</h1>
  <div class="mint"><p>Mint <span data-token="ticker"></span></p><p class="mono" data-token="mint"></p></div>
  <p class="sub">Always check the mint against justresize.com/token before you use it.</p>
  <p class="foot">justresize.com/token</p>
  <div class="figure disc">
    <svg viewBox="0 0 32 32"><path d="M10.5 15.25v-4.75h4.75M21.5 16.75v4.75h-4.75" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
</body></html>
