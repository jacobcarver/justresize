<!doctype html>
<!-- X header: the file-size equation carries it (the site's own example numbers), with the signature small beside it. -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="x-header.css">
<style>
  .copy { position: absolute; left: 330px; top: 50%; transform: translateY(-50%); }
  .equation { font-size: 92px; font-weight: 500; letter-spacing: -0.04em; line-height: 1; color: var(--fg-tertiary); white-space: nowrap; }
  .equation b { font-weight: 500; color: var(--accent-text); }
  .equation .arrow { margin: 0 0.28em; color: var(--fg-disabled); }
  .line { margin-top: 26px; font-size: 40px; color: var(--fg-secondary); }
  .lockup { position: absolute; right: 120px; top: 50%; transform: translateY(-50%); }
</style></head>
<body>
  <div class="copy">
    <p class="equation mono">5.8 MB<span class="arrow">→</span><b>482 KB</b></p>
    <p class="line">Smaller images. Nothing uploaded.</p>
  </div>
  <div class="lockup small"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#3563e9"/><path d="M9 15V9h6M23 17v6h-6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>justresize.com</span></div>
</body></html>
