<!doctype html>
<!-- Share image for /token, 1200 × 630. Carries no address, name or ticker: those are only ever read from the page itself. -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  :root { --w: 1200px; --h: 630px; }
  .wordmark { position: absolute; left: 72px; top: 64px; font-size: 34px; }
  .headline { position: absolute; left: 72px; top: 222px; width: 620px; font-size: 68px; }
  .sub { position: absolute; left: 72px; top: 392px; font-size: 30px; }
  .foot { position: absolute; left: 72px; bottom: 60px; font-size: 22px; }
  .disc { position: absolute; right: 120px; top: 175px; width: 280px; height: 280px; border-radius: 50%; background: var(--accent); }
  .disc svg { display: block; width: 100%; height: 100%; }
</style></head>
<body>
  <div class="wordmark"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#3563e9"/><path d="M9 15V9h6M23 17v6h-6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>JustResize</div>
  <h1 class="headline">JustResize on Solana</h1>
  <p class="sub secondary">Official token information</p>
  <p class="foot tertiary">justresize.com/token</p>
  <div class="disc">
    <svg viewBox="0 0 32 32"><path d="M10.5 15.25v-4.75h4.75M21.5 16.75v4.75h-4.75" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
</body></html>
