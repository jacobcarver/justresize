<!doctype html>
<!-- Feature post: local processing, 1600 × 900. -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="post.css">
<style>
  .headline { width: 760px; font-size: 80px; }
  .sub { top: 560px; }
  .flow { width: 480px; font-size: 26px; }
  .step { border: 1px solid var(--line); border-radius: 8px; padding: 22px 26px; }
  .step small { display: block; margin-top: 4px; font-size: 20px; color: var(--fg-tertiary); }
  .arrow { height: 40px; display: grid; place-items: center; color: var(--fg-tertiary); font-size: 26px; }
  .server { margin-top: 40px; border: 1px dashed var(--line); border-radius: 8px; padding: 22px 26px; color: var(--fg-disabled); }
  .server s { margin-right: 14px; }
  .server span { font-size: 20px; color: var(--fg-tertiary); }
</style></head>
<body>
  <div class="wordmark"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#3563e9"/><path d="M9 15V9h6M23 17v6h-6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>JustResize</div>
  <h1 class="headline">Your images never leave your browser.</h1>
  <p class="sub">Resizing happens on your device. There is no upload step.</p>
  <p class="foot">justresize.com</p>
  <div class="figure flow">
    <div class="step">Image file<small>On your device</small></div>
    <div class="arrow">↓</div>
    <div class="step">Your browser<small>Resize, compress, convert</small></div>
    <div class="arrow">↓</div>
    <div class="step">New file<small>Saved to your device</small></div>
    <div class="server"><s>Server</s><span>Not on the path</span></div>
  </div>
</body></html>
