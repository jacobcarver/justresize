<!doctype html>
<!-- Share image for the site, 1200 × 630. -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  :root { --w: 1200px; --h: 630px; }
  .wordmark { position: absolute; left: 72px; top: 64px; font-size: 34px; }
  .headline { position: absolute; left: 72px; top: 196px; width: 600px; font-size: 84px; }
  .equation { position: absolute; left: 72px; top: 396px; width: 540px; font-size: 28px; line-height: 1.35; }
  .foot { position: absolute; left: 72px; bottom: 60px; font-size: 22px; }
  .figure { position: absolute; right: 84px; top: 152px; --fw: 400px; }
</style></head>
<body>
  <div class="wordmark"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#3563e9"/><path d="M9 15V9h6M23 17v6h-6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>JustResize</div>
  <h1 class="headline">Private compression tool.</h1>
  <p class="equation secondary">Compress, resize and convert images in your browser. Nothing is uploaded.</p>
  <p class="foot tertiary">justresize.com</p>
  <div class="figure">
    <div class="rf mono">
      <span class="rf-original">4032 × 3024</span>
      <div class="rf-output">
        <div class="rf-w"><b></b><i></i><span>1600</span><i></i><b></b></div>
        <div class="rf-h"><b></b><i></i><span>1200</span><i></i><b></b></div>
        <img src="sample.jpg" alt="">
      </div>
    </div>
  </div>
</body></html>
