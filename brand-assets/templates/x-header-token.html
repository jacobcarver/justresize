<!doctype html>
<!--
  X / Twitter header for the token account or the launch period, 1500 × 500. Same safe area as x-header.html.
  No address appears here on purpose: a header cannot be verified, the token page can.
-->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  :root { --w: 1500px; --h: 500px; }
  .copy { position: absolute; left: 120px; top: 132px; }
  .wordmark { font-size: 44px; }
  .wordmark .slash { color: var(--fg-disabled); font-weight: 400; margin: 0 0.1em; }
  .tagline { margin-top: 30px; font-size: 40px; font-weight: 500; letter-spacing: -0.02em; }
  .meta { margin-top: 18px; font-size: 22px; }
  .disc { position: absolute; right: 190px; top: 120px; width: 260px; height: 260px; border-radius: 50%; background: var(--accent); }
  .disc svg { display: block; width: 100%; height: 100%; }
</style></head>
<body>
  <div class="copy">
    <div class="wordmark"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#3563e9"/><path d="M9 15V9h6M23 17v6h-6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>JustResize <span class="slash">/</span> Solana</div>
    <p class="tagline">Official token information.</p>
    <p class="meta tertiary">Verify the mint at justresize.com/token</p>
  </div>
  <div class="disc">
    <svg viewBox="0 0 32 32"><path d="M10.5 15.25v-4.75h4.75M21.5 16.75v4.75h-4.75" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
</body></html>
