<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- A pattern of quarter-circle tiles, used by x-header-tiles.html only. The figures use sample.jpg, one of the site's example photographs (public/samples). -->
  <rect width="400" height="300" fill="#e6dfcf"/>
  <g><path d="M100 100L0 100A100 100 0 0 1 100 0Z" fill="#3563e9"/></g>
  <g transform="translate(100 0)"><rect width="100" height="100" fill="#1d2030"/><path d="M0 100L100 100A100 100 0 0 0 0 0Z" fill="#e6dfcf"/></g>
  <g transform="translate(200 0)"><rect width="100" height="100" fill="#e8674a"/><path d="M0 0L100 0A100 100 0 0 1 0 100Z" fill="#1d2030"/></g>
  <g transform="translate(300 0)"><path d="M100 0L0 0A100 100 0 0 0 100 100Z" fill="#8fb39a"/></g>
  <g transform="translate(0 100)"><rect width="100" height="100" fill="#8fb39a"/><path d="M100 0L0 0A100 100 0 0 0 100 100Z" fill="#1d2030"/></g>
  <g transform="translate(100 100)"><path d="M0 0L100 0A100 100 0 0 1 0 100Z" fill="#e8674a"/></g>
  <g transform="translate(200 100)"><rect width="100" height="100" fill="#3563e9"/><path d="M0 100L100 100A100 100 0 0 0 0 0Z" fill="#e6dfcf"/></g>
  <g transform="translate(300 100)"><rect width="100" height="100" fill="#1d2030"/><path d="M100 100L0 100A100 100 0 0 1 100 0Z" fill="#e8674a"/></g>
  <g transform="translate(0 200)"><path d="M0 100L100 100A100 100 0 0 0 0 0Z" fill="#1d2030"/></g>
  <g transform="translate(100 200)"><rect width="100" height="100" fill="#e8674a"/><path d="M100 100L0 100A100 100 0 0 1 100 0Z" fill="#e6dfcf"/></g>
  <g transform="translate(200 200)"><path d="M100 0L0 0A100 100 0 0 0 100 100Z" fill="#3563e9"/></g>
  <g transform="translate(300 200)"><rect width="100" height="100" fill="#8fb39a"/><path d="M0 0L100 0A100 100 0 0 1 0 100Z" fill="#e6dfcf"/></g>
</svg>
